<svg fill="none" viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          background: radial-gradient(circle at 0% 0%, #161233 0%, #0d0b18 100%);
          border: 1px solid rgba(255, 255, 255, 0.08);
          border-radius: 16px;
          padding: 24px;
          color: #f3f4f6;
          box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
          height: 400px;
          box-sizing: border-box;
          overflow: hidden;
        }

        .title {
          font-size: 20px;
          font-weight: 700;
          margin-bottom: 20px;
          color: #00F7FF;
          display: flex;
          align-items: center;
          gap: 8px;
          text-shadow: 0 0 10px rgba(0, 247, 255, 0.3);
        }

        .grid {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 20px;
        }

        .category {
          background: rgba(255, 255, 255, 0.03);
          border: 1px solid rgba(255, 255, 255, 0.05);
          border-radius: 12px;
          padding: 16px;
          transition: all 0.3s ease;
        }

        .category:hover {
          border-color: rgba(0, 247, 255, 0.3);
          background: rgba(0, 247, 255, 0.02);
          box-shadow: 0 4px 20px rgba(0, 247, 255, 0.05);
          transform: translateY(-2px);
        }

        .cat-title {
          font-size: 14px;
          font-weight: 600;
          color: #9ca3af;
          margin-bottom: 12px;
          text-transform: uppercase;
          letter-spacing: 0.05em;
        }

        .badges-wrapper {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
        }

        .badge {
          display: inline-flex;
          align-items: center;
          background: rgba(255, 255, 255, 0.06);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 20px;
          padding: 6px 12px;
          font-size: 12px;
          font-weight: 500;
          color: #e5e7eb;
          transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
          cursor: default;
          animation: float 4s ease-in-out infinite alternate;
        }

        .badge:hover {
          background: #00F7FF;
          color: #0b0914;
          border-color: #00F7FF;
          box-shadow: 0 0 12px rgba(0, 247, 255, 0.4);
          transform: scale(1.05);
        }

        @keyframes float {
          0% { transform: translateY(0px); }
          100% { transform: translateY(-4px); }
        }

        /* Stagger animation delay for badges */
        .badge:nth-child(2n) { animation-delay: 0.5s; }
        .badge:nth-child(3n) { animation-delay: 1s; }
        .badge:nth-child(4n) { animation-delay: 1.5s; }

        .sparkle {
          animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
          0% { opacity: 0.6; }
          100% { opacity: 1; text-shadow: 0 0 15px #00F7FF; }
        }
      </style>

      <div class="container">
        <div class="title">
          <span class="sparkle">⚡ Tech Stack &amp; Key Expertise</span>
        </div>

        <div class="grid">
          <!-- Category 1: Languages -->
          <div class="category">
            <div class="cat-title">✍️ Languages</div>
            <div class="badges-wrapper">
              <span class="badge">Java</span>
              <span class="badge">Python</span>
              <span class="badge">SQL</span>
              <span class="badge">TypeScript</span>
              <span class="badge">JavaScript</span>
            </div>
          </div>

          <!-- Category 2: Backend Core -->
          <div class="category">
            <div class="cat-title">⚙️ Backend &amp; Architecture</div>
            <div class="badges-wrapper">
              <span class="badge">Spring Boot</span>
              <span class="badge">Microservices</span>
              <span class="badge">Apache Kafka</span>
              <span class="badge">Node.js</span>
              <span class="badge">Express.js</span>
              <span class="badge">REST APIs</span>
              <span class="badge">RBAC Security</span>
            </div>
          </div>

          <!-- Category 3: Frontend Suite -->
          <div class="category">
            <div class="cat-title">🎨 Frontend &amp; UI</div>
            <div class="badges-wrapper">
              <span class="badge">React.js</span>
              <span class="badge">TanStack Router</span>
              <span class="badge">TanStack Query</span>
              <span class="badge">Tailwind CSS v4</span>
              <span class="badge">shadcn/ui</span>
              <span class="badge">Framer Motion</span>
            </div>
          </div>

          <!-- Category 4: Databases -->
          <div class="category">
            <div class="cat-title">🗄️ Databases &amp; Caching</div>
            <div class="badges-wrapper">
              <span class="badge">PostgreSQL</span>
              <span class="badge">MongoDB</span>
              <span class="badge">MySQL</span>
              <span class="badge">Redis</span>
            </div>
          </div>

          <!-- Category 5: Cloud & DevOps -->
          <div class="category">
            <div class="cat-title">☁️ Cloud &amp; DevOps</div>
            <div class="badges-wrapper">
              <span class="badge">GCP (GKE)</span>
              <span class="badge">Docker</span>
              <span class="badge">Kubernetes</span>
              <span class="badge">TurboRepo</span>
              <span class="badge">PNPM</span>
              <span class="badge">CI/CD</span>
            </div>
          </div>

          <!-- Category 6: AI & ML -->
          <div class="category">
            <div class="cat-title">🤖 AI &amp; Intelligence</div>
            <div class="badges-wrapper">
              <span class="badge">Gemini API</span>
              <span class="badge">NLP</span>
              <span class="badge">Scikit-learn</span>
              <span class="badge">TF-IDF</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
